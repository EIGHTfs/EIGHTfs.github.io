<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>DSH Plugin Store - DeepSeek Harness 插件商店</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/typeface-source-code-pro@0.0.71/index.min.css">
  <style>
    /* Reset & Base */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #1a1d26 0%, #2a2e3a 100%);
      color: #e5e9f0;
      min-height: 100vh;
      line-height: 1.6;
    }
    
    /* Header */
    .header {
      background: rgba(26, 29, 38, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #3a3f4b;
      padding: 1rem 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: #4176e6;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #4176e6, #6b9fff);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }
    
    /* Search & Filters */
    .controls {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 2rem;
    }
    .search-box {
      position: relative;
      margin-bottom: 1rem;
    }
    .search-box input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 3rem;
      background: rgba(42, 46, 58, 0.8);
      border: 1px solid #3a3f4b;
      border-radius: 8px;
      color: #e5e9f0;
      font-size: 1rem;
      transition: all 0.3s;
    }
    .search-box input:focus {
      outline: none;
      border-color: #4176e6;
      box-shadow: 0 0 0 3px rgba(65, 118, 230, 0.2);
    }
    .search-box::before {
      content: "🔍";
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
    }
    .filters {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 0.4rem 1rem;
      background: rgba(42, 46, 58, 0.6);
      border: 1px solid #3a3f4b;
      border-radius: 20px;
      color: #8c91a0;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 0.9rem;
    }
    .filter-btn:hover, .filter-btn.active {
      background: #4176e6;
      border-color: #4176e6;
      color: #fff;
    }
    
    /* Stats */
    .stats {
      max-width: 1200px;
      margin: 0 auto 1rem;
      padding: 0 2rem;
      display: flex;
      gap: 2rem;
      color: #8c91a0;
      font-size: 0.9rem;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    /* Plugin Grid */
    .plugin-grid {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }
    
    /* Plugin Card */
    .plugin-card {
      background: rgba(42, 46, 58, 0.6);
      border: 1px solid #3a3f4b;
      border-radius: 12px;
      padding: 1.5rem;
      transition: all 0.3s;
      display: flex;
      flex-direction: column;
    }
    .plugin-card:hover {
      transform: translateY(-4px);
      border-color: #4176e6;
      box-shadow: 0 8px 24px rgba(65, 118, 230, 0.2);
    }
    .plugin-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }
    .plugin-name {
      font-size: 1.2rem;
      font-weight: 600;
      color: #e5e9f0;
      text-decoration: none;
    }
    .plugin-name:hover {
      color: #4176e6;
    }
    .plugin-meta {
      display: flex;
      gap: 1rem;
      font-size: 0.85rem;
      color: #8c91a0;
      margin-bottom: 0.75rem;
    }
    .meta-item {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .plugin-desc {
      color: #b0b5c0;
      font-size: 0.95rem;
      line-height: 1.5;
      flex: 1;
      margin-bottom: 1rem;
    }
    .plugin-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 1px solid #3a3f4b;
    }
    .language-tag {
      padding: 0.25rem 0.75rem;
      background: rgba(65, 118, 230, 0.2);
      border-radius: 12px;
      font-size: 0.8rem;
      color: #6b9fff;
    }
    .install-btn {
      padding: 0.5rem 1.25rem;
      background: linear-gradient(135deg, #4176e6, #6b9fff);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .install-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(65, 118, 230, 0.4);
    }
    
    /* Loading & Error */
    .loading, .error {
      text-align: center;
      padding: 3rem;
      color: #8c91a0;
    }
    .error {
      color: #e5484d;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #3a3f4b;
      border-top-color: #4176e6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* Footer */
    .footer {
      text-align: center;
      padding: 2rem;
      color: #8c91a0;
      font-size: 0.9rem;
      border-top: 1px solid #3a3f4b;
      margin-top: 2rem;
    }
    .footer a {
      color: #4176e6;
      text-decoration: none;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .plugin-grid {
        grid-template-columns: 1fr;
      }
      .header-inner {
        flex-direction: column;
        gap: 1rem;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="#" class="logo">
        <div class="logo-icon">📦</div>
        DSH Plugin Store
      </a>
      <a href="https://github.com/EIGHTfs" target="_blank" style="color: #8c91a0; text-decoration: none;">
        GitHub Profile
      </a>
    </div>
  </header>

  <div class="controls">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索插件...">
    </div>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="JavaScript">JavaScript</button>
      <button class="filter-btn" data-filter="Shell">Shell</button>
      <button class="filter-btn" data-filter="Python">Python</button>
      <button class="filter-btn" data-filter="HTML">HTML</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat-item">
      <span>📊</span>
      <span id="totalCount">加载中...</span>
    </div>
    <div class="stat-item">
      <span>🔄</span>
      <span id="lastUpdate">-</span>
    </div>
  </div>

  <main class="plugin-grid" id="pluginGrid">
    <div class="loading">
      <div class="spinner"></div>
      <p>正在加载插件列表...</p>
    </div>
  </main>

  <footer class="footer">
    <p>Powered by <a href="https://github.com/EIGHTfs/EIGHTfs.github.io" target="_blank">EIGHTfs</a> | 
    数据来源于 <a href="https://github.com/EIGHTfs" target="_blank">GitHub API</a></p>
  </footer>

  <script>
    const GITHUB_USER = 'EIGHTfs';
    let allRepos = [];
    let currentFilter = 'all';
    let searchTerm = '';

    async function fetchRepos() {
      try {
        const response = await fetch(`https://api.github.com/users/${GITHUB_USER}/repos?per_page=100&sort=updated&direction=desc`);
        if (!response.ok) throw new Error('Failed to fetch repos');
        allRepos = await response.json();
        updateStats();
        renderPlugins();
      } catch (error) {
        document.getElementById('pluginGrid').innerHTML = `
          <div class="error" style="grid-column: 1/-1;">
            <p>❌ 加载失败: ${error.message}</p>
            <p style="font-size: 0.9rem; margin-top: 0.5rem;">请稍后重试</p>
          </div>
        `;
      }
    }

    function updateStats() {
      document.getElementById('totalCount').textContent = `${allRepos.length} 个仓库`;
      const now = new Date();
      document.getElementById('lastUpdate').textContent = `更新于 ${now.toLocaleTimeString('zh-CN')}`;
    }

    function getFilteredRepos() {
      return allRepos.filter(repo => {
        const matchesFilter = currentFilter === 'all' || repo.language === currentFilter;
        const matchesSearch = !searchTerm || 
          repo.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
          (repo.description || '').toLowerCase().includes(searchTerm.toLowerCase());
        return matchesFilter && matchesSearch;
      });
    }

    function renderPlugins() {
      const filtered = getFilteredRepos();
      const grid = document.getElementById('pluginGrid');
      
      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="error" style="grid-column: 1/-1;">
            <p>🔍 没有找到匹配的插件</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(repo => `
        <article class="plugin-card">
          <div class="plugin-header">
            <a href="${repo.html_url}" target="_blank" class="plugin-name">
              ${repo.name}
            </a>
          </div>
          <div class="plugin-meta">
            <span class="meta-item">⭐ ${repo.stargazers_count}</span>
            <span class="meta-item">🍴 ${repo.forks_count}</span>
            <span class="meta-item">👁️ ${repo.watchers_count}</span>
          </div>
          <p class="plugin-desc">${repo.description || '暂无描述'}</p>
          <div class="plugin-footer">
            <span class="language-tag">${repo.language || 'N/A'}</span>
            <a href="${repo.html_url}" target="_blank" class="install-btn">
              查看详情 →
            </a>
          </div>
        </article>
      `).join('');
    }

    // Event Listeners
    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchTerm = e.target.value;
      renderPlugins();
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderPlugins();
      });
    });

    // Initialize
    fetchRepos();
  </script>
</body>
</html>
